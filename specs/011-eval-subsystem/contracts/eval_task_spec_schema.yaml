2. Update `grader` Literal enum with new values
3. Provide migrator script to backfill old YAML files
4. Document in `grader_extensibility` field usage

---

## Implementation Notes

- YAML files are loaded by `eval.task_loader.load_all(evals_dir: str)`
- Pydantic validates each spec via `EvalTaskSpec.model_validate(yaml_dict)`
- Invalid specs raise exceptions immediately (fail-fast)
- Loader returns `list[EvalTaskSpec]` sorted by task_id (deterministic)
